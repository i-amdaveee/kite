[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

# Arc requires a min base fee of 20 gwei. Local tests and local anvil runs do not
# need it; the Arc deploy scripts set maxFeePerGas explicitly (Phase 2, verify
# against docs.arc.io before hardcoding).
#
# [profile.arc]
# gas_price = 20000000000

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"